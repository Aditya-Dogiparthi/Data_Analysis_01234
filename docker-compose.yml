services:
  db:
    image: postgres:16
    container_name: collections-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collections}
      POSTGRES_USER: ${POSTGRES_USER:-collections_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - collections_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collections_admin} -d ${POSTGRES_DB:-collections}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  collections_pgdata:
